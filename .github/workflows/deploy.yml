name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'   # täglich: Combo-Daten von Commander Spellbook auffrischen

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Demo-Version (Beispieldaten)
        run: npx vite build --config vite.demo.config.mjs
      - name: Combo-Daten (Commander Spellbook)
        run: node --max-old-space-size=6000 scripts/build-combos.mjs dist/data/combos.json
        continue-on-error: true
      - run: mkdir -p dist/demo/data && cp -r dist/data/. dist/demo/data/ || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
